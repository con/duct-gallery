    tags:
      - synthetic
      - asmacdo
  - title: "'s5cmd sync' dry invocation on a mighty dandiarchive bucket"
    source_repo: ""
    info_file: "logs/s5cmd-1/2024.10.28T11.08.51-2733714_info.json"
    tags:
      - local
      - s5cmd
    description: >-
      A single process running steadily for seven hours. The raw view is the honest one here:
      the time-point estimate widens into a band as the process ages (see "Reading the plots"),
      so the sawtooth is measurement noise, not the workload.
  - title: "mriqc processing on a single subject/session"
    source_repo: "https://cerebra.fz-juelich.de/f.hoffstaedter/ds005256-mriqc"
    info_file: "https://cerebra.fz-juelich.de/f.hoffstaedter/ds005256-mriqc/media/branch/base/logs/duct/sub-0001_2025.09.17T23.06.15-3344424_info.json"
    tags:
      - mriqc
      - juelich
    description: >-
      A seventeen-hour run with a handful of processes. The raw view opens with a spike
      (220% in the first minute) that drifts down over the first few hours before settling
      near 100%: that is the lifetime average catching up with the steady state, not the
      workload winding down (see "Reading the plots"). The time-point view has no such
      spike; it follows the workload from the start.
  - title: "fMRIPrep on 1 subject of ds000030"
    source_repo: ""
    info_file: "logs/fmriprep-ds000030-c5/acq-2026.09.09T00.59.50+64123263_1_info.json"
    tags:
      - local
      - fmriprep
      - openneuro
      - mechababs
    description: >-
      fMRIPrep `--level minimal` on one subject of the UCLA CNP LA5c study (OpenNeuro
      ds000030): 5.2 hours, 16.9 GB peak. A reading key first, because duct wraps a whole
      tree of processes and each sample is a snapshot of all of them. The dotted lines are
      single processes. The solid line is the largest single process at each sample, a lower
      bound on what the tree needed together. The dashed line is the sum across processes,
      an upper bound: for memory it counts pages shared between processes once per process.
      The summary numbers in `info.json`, like the 16.9 GB peak here, are the maximum of that
      dashed line. In this run the nipype log in stdout puts FreeSurfer's recon-all in the
      first three hours, where the CPU holds near 200%; after it finishes the profile gets
      busier and memory climbs in steps to the peak. The two CPU views agree here. SLURM's
      accounting reported 22.3 GB MaxRSS for the same job. On this cluster that number is the
      job cgroup's memory counter, which includes file cache the kernel would reclaim when
      memory runs short, so it sits above even duct's upper bound.
  - title: "fMRIPrep on 1 subject of ds002785"
    source_repo: ""
    info_file: "logs/fmriprep-ds002785-c5/acq-2026.09.08T19.49.36+64107796_1_info.json"
    tags:
      - local
      - fmriprep
      - openneuro
      - mechababs
    description: >-
      The same configuration on one subject of AOMIC-PIOP1 (OpenNeuro ds002785): 8.15 hours,
      25.7 GB peak (SLURM reported 34 GB; same caveat as above). recon-all again finishes
      about three hours in, and the rest is long plateaus. The two memory bounds separate
      most from 4.2 to 6.9 hours, where the largest single process holds 10 GB while the sum
      across processes sits near 20 GB; the run's peak at 5.5 hours is one 12 GB process on
      top of the rest. The CPU spike is the very last sample, at 8.15 hours: the raw view
      sums 3600% across 27 processes, which stretches the axis and flattens everything else.
      Those are short-lived processes in the run's final seconds, each with a near-zero
      lifetime, whose inflated `%CPU` values add up (the largest single one reads 900%). The
      time-point estimate needs two samples of a process, so those pids drop out and the
      400% plateau underneath stays readable.
